version: "3.9"
services:
  cortexos-api:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./cortexos.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped
